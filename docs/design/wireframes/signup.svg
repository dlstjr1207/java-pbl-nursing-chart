<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title>회원가입</title>
<rect width="1280" height="880" fill="#F8F9FF"/>
<rect x="0" y="0" width="560" height="880" rx="0" fill="#00236F" stroke="#00236F" stroke-width="1"/>
<text x="60" y="360" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="start">회원가입</text>
<text x="60" y="410" font-size="18" font-weight="400" fill="#C9D4FF" text-anchor="start">이 PC에서 사용할 계정을 만듭니다.</text>
<text x="60" y="440" font-size="18" font-weight="400" fill="#FFD9A8" text-anchor="start">다른 서비스의 비밀번호를 사용하지 마세요.</text>
<text x="60" y="820" font-size="13" font-weight="400" fill="#C9D4FF" text-anchor="start">교육용 예시 · 임상 검수 전</text>
<rect x="700" y="90" width="480" height="700" rx="14" fill="#FFFFFF" stroke="#D5D8E4" stroke-width="1"/>
<text x="740" y="150" font-size="26" font-weight="700" fill="#00236F" text-anchor="start">새 계정 만들기</text>
<text x="740" y="190" font-size="13" font-weight="600" fill="#1B1F2A" text-anchor="start">이름 *</text>
<rect x="740" y="198" width="400" height="40" rx="6" fill="#FFFFFF" stroke="#D5D8E4" stroke-width="1"/>
<text x="752" y="223.0" font-size="13" font-weight="400" fill="#757682" text-anchor="start">홍길동</text>
<text x="740" y="270" font-size="13" font-weight="600" fill="#1B1F2A" text-anchor="start">아이디 *</text>
<rect x="740" y="278" width="400" height="40" rx="6" fill="#FFFFFF" stroke="#D5D8E4" stroke-width="1"/>
<text x="752" y="303.0" font-size="13" font-weight="400" fill="#757682" text-anchor="start">영문·숫자 4~20자</text>
<text x="740" y="350" font-size="13" font-weight="600" fill="#1B1F2A" text-anchor="start">비밀번호 *</text>
<rect x="740" y="358" width="400" height="40" rx="6" fill="#FFFFFF" stroke="#D5D8E4" stroke-width="1"/>
<text x="752" y="383.0" font-size="13" font-weight="400" fill="#757682" text-anchor="start">8자 이상 (`TODO` 정책 확정)</text>
<text x="740" y="430" font-size="13" font-weight="600" fill="#1B1F2A" text-anchor="start">비밀번호 확인 *</text>
<rect x="740" y="438" width="400" height="40" rx="6" fill="#FFFFFF" stroke="#D5D8E4" stroke-width="1"/>
<text x="752" y="463.0" font-size="13" font-weight="400" fill="#757682" text-anchor="start">한 번 더 입력</text>
<text x="740" y="510" font-size="13" font-weight="600" fill="#1B1F2A" text-anchor="start">소속·경력 단계 *</text>
<rect x="740" y="518" width="400" height="40" rx="6" fill="#FFFFFF" stroke="#D5D8E4" stroke-width="1"/>
<text x="752" y="543.0" font-size="13" font-weight="400" fill="#757682" text-anchor="start">선택: 간호학부 3·4학년 / 1년차 간호사 …</text>
<text x="1118" y="543.0" font-size="12" font-weight="400" fill="#757682" text-anchor="start">▼</text>
<text x="740" y="600" font-size="13" font-weight="400" fill="#BA1A1A" text-anchor="start">이미 사용 중인 아이디입니다</text>
<text x="1140" y="600" font-size="12" font-weight="400" fill="#757682" text-anchor="end">(중복 시에만 표시)</text>
<rect x="740" y="625" width="400" height="48" rx="8" fill="#00236F" stroke="#00236F" stroke-width="1"/>
<text x="940.0" y="654.0" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">가입하기</text>
<rect x="740" y="690" width="400" height="44" rx="8" fill="#FFFFFF" stroke="#00236F" stroke-width="1.5"/>
<text x="940.0" y="717.0" font-size="15" font-weight="600" fill="#00236F" text-anchor="middle">로그인으로 돌아가기</text>
<rect x="1130" y="50" width="44" height="22" rx="11" fill="#FFE9A8" stroke="#FFE9A8" stroke-width="1"/>
<text x="1152" y="65" font-size="12" font-weight="700" fill="#6B4E00" text-anchor="middle">신규</text>
</svg>
